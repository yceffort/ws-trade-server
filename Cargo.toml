[package]
name = "ws-trade-server"
version = "0.1.0"
edition = "2024"

[features]
ha = ["dep:rdkafka", "dep:sha2", "dep:reqwest"]

[[bin]]
name = "ha-feed"
path = "src/bin/ha-feed.rs"
required-features = ["ha"]

[dependencies]
rdkafka = { version = "=0.39.0", optional = true, default-features = false, features = ["tokio", "ssl-vendored", "libz-static", "tracing"] }
sha2 = { version = "0.10.9", optional = true }
reqwest = { version = "0.12.24", optional = true, default-features = false, features = ["blocking", "json", "rustls-tls"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
tracing-appender = "0.2.5"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
futures-util = "0.3.34"
memmap2 = "0.9.12"
prost = "0.14.6"
rand = "0.10.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "signal"] }
tokio-tungstenite = "0.30.0"

[dev-dependencies]
serde_json = { version = "1.0.154", features = ["preserve_order"] }

[build-dependencies]
prost-build = "0.14.6"
protox = "0.10.0"

[lints.rust]
unsafe_code = "deny"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"
