name: Bench

on:
  workflow_dispatch:
  pull_request:
    paths:
      - src/**
      - proto/**
      - build.rs
      - Cargo.toml
      - Cargo.lock
      - bench/**
      - .github/workflows/bench.yml

# 같은 브랜치에 새 커밋이 오면 앞선 실행을 멈춘다.
concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # 이 뒤에 PR의 코드를 실행하므로 토큰을 git 설정에 남기지 않는다.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # PR이면 기준도 받아 같은 러너에서 번갈아 돌린다. 브랜치 이름으로 받으면 실행을 기다리는 사이 기준이 움직일 수 있어 커밋으로 고정한다.
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      - name: Install Rust 1.95.0
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            base -> target
      # gateway와 loadgen이 코어를 다투지 않게 절반씩 나눈다.
      - name: Split cores
        run: |
          cores=$(nproc)
          if [ "$cores" -ge 2 ]; then
            echo "GATEWAY_CPUS=0-$((cores / 2 - 1))" >>"$GITHUB_ENV"
            echo "LOADGEN_CPUS=$((cores / 2))-$((cores - 1))" >>"$GITHUB_ENV"
          fi
      - run: bench/ci.sh ${{ github.event_name == 'pull_request' && 'base' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-results
          path: |
            bench/results/ci-*.json
            base/bench/results/ci-*.json
