name: HA
on:
  pull_request:
    paths:
      - src/**
      - tests/**
      - examples/ha-*.mjs
      - edge/**
      - proto/**
      - build.rs
      - Cargo.toml
      - Cargo.lock
      - deploy/ha/**
      - bench/ha/**
      - probe/**
      - .dockerignore
      - deploy/container/probe.sh
      - deploy/k8s/ha/**
      - .github/workflows/ha.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ha-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ha-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy && rustup default 1.95.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --features ha --all-targets -- -D warnings
      - run: cargo test --locked --features ha
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --prefix edge --ignore-scripts && npm test --prefix edge && node --test examples/ha-*.test.mjs deploy/k8s/ha/*.test.mjs bench/ha/*.test.mjs
      - name: Verify dashboard queries and missing samples
        run: node deploy/k8s/ha/observability/dashboard-check.mjs
      - name: Verify HA alert thresholds and recovery
        run: docker run --rm --entrypoint /bin/promtool -v "$PWD/deploy/k8s/ha/observability:/rules:ro" -w /rules prom/prometheus@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996 test rules prometheus-rules.test.yaml alert-rules.test.json
      - name: Validate observability stack configs
        run: |
          stack="$PWD/deploy/k8s/ha/observability"
          docker run --rm --entrypoint /bin/promtool -v "$stack:/etc/prometheus:ro" prom/prometheus@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996 check config --syntax-only /etc/prometheus/stack/prometheus.yml
          docker run --rm -v "$stack/stack:/etc/loki:ro" grafana/loki@sha256:3165cecce301ce5b9b6e3530284b080934a05cd5cafac3d3d82edcb887b45ecd -config.file=/etc/loki/loki-config.yaml -verify-config
          docker run --rm -v "$stack/stack:/etc/alloy:ro" grafana/alloy@sha256:1bc130e909116a4bf950eb5187a346007d3b796f96832b529acb14a64e41230f fmt /etc/alloy/config.alloy | diff - "$stack/stack/config.alloy"
  replicated-log:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.95.0 --profile minimal && rustup default 1.95.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: deploy/ha/smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: producer-failover
          path: deploy/local/ha/results/*.json
  ha-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/ha/Dockerfile
          push: false
          load: true
          tags: ws-trade-ha:test
          cache-from: type=gha,scope=ha
          cache-to: type=gha,mode=max,scope=ha
      - run: docker run --rm --entrypoint sh ws-trade-ha:test -c 'command -v gateway && command -v ha-feed && command -v ha-oracle && command -v container-probe'

      - name: Build and verify the acceptance client image
        run: |
          docker build -f edge/Dockerfile -t ws-trade-edge:test .
          docker build -f bench/ha/Dockerfile --build-arg HA_IMAGE=ws-trade-ha:test --build-arg EDGE_IMAGE=ws-trade-edge:test -t ws-trade-ha-load:test .
          docker run --rm --entrypoint sh ws-trade-ha-load:test -c 'test -x /app/ha-oracle && node --test /app/bench/ha/oracle.test.mjs /app/bench/ha/journal.test.mjs'

  alert-delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node deploy/k8s/ha/observability/alert-smoke.mjs
