name: Deployment

on:
  pull_request:
    paths: ['Dockerfile', '.dockerignore', 'compose.yaml', 'deploy/**', 'edge/**', 'src/**', 'proto/**', 'Cargo.*', 'build.rs', 'bench/soak/client.mjs', '.github/workflows/deploy.yml']
  push:
    branches: [main]
    paths: ['Dockerfile', '.dockerignore', 'compose.yaml', 'deploy/**', 'edge/**', 'src/**', 'proto/**', 'Cargo.*', 'build.rs', 'bench/soak/client.mjs', '.github/workflows/deploy.yml']
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --prefix edge
      - run: docker compose build
      - run: bash deploy/compose-smoke.sh
