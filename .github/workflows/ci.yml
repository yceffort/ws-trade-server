name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# 같은 브랜치에 새 커밋이 오면 앞선 실행을 멈춘다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # 이 뒤에 PR의 코드를 빌드하고 실행하므로 토큰을 git 설정에 남기지 않는다.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # clippy가 잡는 경고는 판마다 달라진다. bench/Dockerfile과 같은 판으로 고정한다.
      - name: Install Rust 1.95.0
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy
          rustup default 1.95.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --prefix edge --ignore-scripts
      - run: node --test capture/extract-contract.test.mjs examples/*.test.mjs
      - run: npm test --prefix edge
      - name: Exercise real WebSocket clients
        run: |
          cargo build --locked --bin gateway --bin feed
          node tests/websocket-e2e.test.mjs
      - name: Exercise combined lifecycle scenarios
        run: node bench/soak.mjs --seconds 6 --cycles 2 --connections 4 --bin-dir target/debug --out /tmp/soak.json
      - name: Show lifecycle result
        if: always()
        run: test ! -f /tmp/soak.json || cat /tmp/soak.json

  miri:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Miri
        run: |
          rustup toolchain install nightly --profile minimal --component miri,rust-src
          cargo +nightly miri setup
      - name: Check the heap ring
        run: cargo +nightly miri test --locked --test ring_miri
