name: CI

on:
  pull_request:
  push:
    branches: [main]

# 같은 브랜치에 새 커밋이 오면 앞선 실행을 멈춘다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # 이 뒤에 PR의 코드를 빌드하고 실행하므로 토큰을 git 설정에 남기지 않는다.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # clippy가 잡는 경고는 판마다 달라진다. bench/Dockerfile과 같은 판으로 고정한다.
      - name: Install Rust 1.95.0
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy
          rustup default 1.95.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test capture/extract-contract.test.mjs
