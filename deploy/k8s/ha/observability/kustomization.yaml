apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# HA 배포의 settings.metricsNamespace와 같은 namespace여야 HA NetworkPolicy가 수집을 허용한다.
namespace: wts-observability
labels:
  - pairs: { app.kubernetes.io/part-of: wts-observability }
    includeSelectors: false
resources:
  - stack/namespace.yaml
  - stack/prometheus.yaml
  - stack/loki.yaml
  - stack/alloy.yaml
  - stack/grafana.yaml
  - stack/kube-state-metrics.yaml
  - stack/alertmanager.yaml
  - stack/alert-receiver.yaml
  - stack/network-policy.yaml
configMapGenerator:
  - name: prometheus-config
    files: [stack/prometheus.yml, scrape.yaml, prometheus-rules.yaml]
  - name: loki-config
    files: [config.yaml=stack/loki-config.yaml]
  - name: alloy-config
    files: [stack/config.alloy]
  - name: grafana-datasources
    files: [stack/datasources.yaml]
  - name: grafana-providers
    files: [stack/dashboards.yaml]
  - name: grafana-dashboards
    files: [dashboards/wts-overview.json]
  - name: alertmanager-config
    files: [stack/alertmanager.yml]
  - name: alert-receiver-source
    files: [alert-receiver.mjs]
  - name: loki-rules
    files: [rules.yaml=loki-rules.yaml]
