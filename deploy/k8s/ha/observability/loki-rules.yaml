groups:
  - name: wts-ha-fencing
    rules:
      - alert: WtsHaUnexpectedFencing
        expr: sum by (namespace) (count_over_time({component="feed"} | json reason="fields.reason", event="fields.event" | event="ha_producer_stopped" | reason="producer-fenced" [5m])) > 0
        labels: { severity: warning }
        annotations: { summary: 'Producer fencing 발생. 계획된 leader 교체와 대조하고 반복 발생 시 중복 writer 또는 Lease 연결을 확인하세요.' }
