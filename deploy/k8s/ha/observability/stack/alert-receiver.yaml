apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-receiver
  labels: { app.kubernetes.io/component: alert-receiver }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/component: alert-receiver } }
  template:
    metadata: { labels: { app.kubernetes.io/component: alert-receiver } }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 65534, runAsGroup: 65534, fsGroup: 65534, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: alert-receiver
          image: node:24-alpine@sha256:116b800c3754b440ee0aa3ed2f20f5bf3d99a554bfd9adeea09ea8017f6e85f5
          command: [node, --max-old-space-size=64, /app/alert-receiver.mjs]
          ports: [{ name: metrics, containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /notifications, port: metrics }, periodSeconds: 5 }
          resources: { requests: { cpu: 25m, memory: 64Mi }, limits: { cpu: 200m, memory: 128Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: source, mountPath: /app }]
      volumes: [{ name: source, configMap: { name: alert-receiver-source } }]
---
apiVersion: v1
kind: Service
metadata: { name: alert-receiver }
spec:
  selector: { app.kubernetes.io/component: alert-receiver }
  ports: [{ name: http, port: 8080, targetPort: metrics }]
