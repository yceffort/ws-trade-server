apiVersion: v1
kind: ServiceAccount
metadata: { name: alloy }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: wts-observability-alloy }
rules:
  - apiGroups: [""]
    resources: [pods, pods/log]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: wts-observability-alloy }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: wts-observability-alloy }
subjects: [{ kind: ServiceAccount, name: alloy, namespace: wts-observability }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alloy
  labels: { app.kubernetes.io/component: alloy }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/component: alloy } }
  template:
    metadata: { labels: { app.kubernetes.io/component: alloy } }
    spec:
      serviceAccountName: alloy
      securityContext: { runAsNonRoot: true, runAsUser: 473, runAsGroup: 473, fsGroup: 473, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: alloy
          image: grafana/alloy:v1.10.0@sha256:1bc130e909116a4bf950eb5187a346007d3b796f96832b529acb14a64e41230f
          args: [run, /etc/alloy/config.alloy, --storage.path=/var/lib/alloy, --server.http.listen-addr=0.0.0.0:12345]
          ports: [{ name: metrics, containerPort: 12345 }]
          readinessProbe: { httpGet: { path: /-/ready, port: metrics }, periodSeconds: 5 }
          resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { cpu: 500m, memory: 256Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts:
            - { name: config, mountPath: /etc/alloy }
            - { name: data, mountPath: /var/lib/alloy }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: config, configMap: { name: alloy-config } }
        - { name: data, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata: { name: alloy }
spec:
  selector: { app.kubernetes.io/component: alloy }
  ports: [{ name: metrics, port: 12345, targetPort: metrics }]
