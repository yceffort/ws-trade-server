apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: loki
  labels: { app.kubernetes.io/component: loki }
spec:
  serviceName: loki
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/component: loki } }
  template:
    metadata: { labels: { app.kubernetes.io/component: loki } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: loki
          image: grafana/loki:3.5.3@sha256:3165cecce301ce5b9b6e3530284b080934a05cd5cafac3d3d82edcb887b45ecd
          args: [-config.file=/etc/loki/config.yaml, -target=all]
          ports: [{ name: metrics, containerPort: 3100 }]
          readinessProbe: { httpGet: { path: /ready, port: metrics }, initialDelaySeconds: 10, periodSeconds: 5 }
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: "1", memory: 512Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts:
            - { name: config, mountPath: /etc/loki }
            - { name: data, mountPath: /var/loki }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: config, configMap: { name: loki-config } }
        - { name: tmp, emptyDir: {} }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 2Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: loki
spec:
  selector: { app.kubernetes.io/component: loki }
  ports: [{ name: metrics, port: 3100, targetPort: metrics }]
