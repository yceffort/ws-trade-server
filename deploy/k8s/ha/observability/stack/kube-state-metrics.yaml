apiVersion: v1
kind: ServiceAccount
metadata: { name: kube-state-metrics }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: wts-observability-pod-state }
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: wts-observability-pod-state }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: wts-observability-pod-state }
subjects: [{ kind: ServiceAccount, name: kube-state-metrics, namespace: wts-observability }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  labels: { app.kubernetes.io/component: kube-state-metrics }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/component: kube-state-metrics } }
  template:
    metadata: { labels: { app.kubernetes.io/component: kube-state-metrics } }
    spec:
      serviceAccountName: kube-state-metrics
      securityContext: { runAsNonRoot: true, runAsUser: 65534, runAsGroup: 65534, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.16.0@sha256:e750cd4b43f782e3106537026c2995cac85d921aedea334e1d16caad7877c360
          args: [--resources=pods, '--metric-labels-allowlist=pods=[app.kubernetes.io/part-of]']
          ports: [{ name: metrics, containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /healthz, port: metrics }, periodSeconds: 5 }
          resources: { requests: { cpu: 25m, memory: 64Mi }, limits: { cpu: 200m, memory: 128Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
---
apiVersion: v1
kind: Service
metadata: { name: kube-state-metrics }
spec:
  selector: { app.kubernetes.io/component: kube-state-metrics }
  ports: [{ name: metrics, port: 8080, targetPort: metrics }]
